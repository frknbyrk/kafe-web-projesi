<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İletişim - Kahve Durağı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Kahve Durağı</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a> |
            <a href="menu.html">Menü</a> |
            <a href="iletisim.html">İletişim</a>
        </nav>
    </header>

    <main>
        <h2>Bize Mesaj Gönderin</h2>
        
        <form class="iletisim-form">
            <p>
                <label>Adınız:</label><br>
                <input type="text" placeholder="Adınızı girin">
            </p>
            <p>
                <label>E-posta Adresiniz:</label><br>
                <input type="email" placeholder="ornek@mail.com">
            </p>
            <p>
                <label>Mesajınız:</label><br>
                <textarea rows="4" cols="30" placeholder="Görüş veya öneriniz..."></textarea>
            </p>
            <button type="submit">Gönder</button>
        </form>

        <section class="adres">
            <h3>Adresimiz</h3>
            <p>Üniversite Caddesi No: 12, Ankara</p>
        </section>
    </main>

</body>
</html>
